<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Active Tracker</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; width: 280px; margin: 0; padding: 12px; background: #181b22; color: #e6e8ee; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  label { display: block; font-size: 11px; color: #9aa1ad; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a2f3a; background: #21252e; color: #e6e8ee; font-family: ui-monospace, monospace; font-size: 12px; }
  button { margin-top: 8px; padding: 6px 12px; border: 1px solid #2a2f3a; background: #2a2f3a; color: #e6e8ee; border-radius: 6px; cursor: pointer; }
  button:hover { background: #353b48; }
  .pause-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .hint { font-size: 11px; color: #9aa1ad; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
  <h3>Active Tracker Bridge</h3>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Connecting</span>
  </div>

  <label for="token">Token</label>
  <input type="text" id="token" placeholder="Paste token from ~/.active_tracker/token" />
  <button id="save">Save and reconnect</button>

  <div class="pause-row">
    <input type="checkbox" id="paused" />
    <label for="paused" style="margin: 0; text-transform: none; letter-spacing: 0; color: #e6e8ee; font-size: 13px;">Pause tab updates</label>
  </div>

  <div class="hint">Connects to ws://127.0.0.1:5006. Token is generated by the Rust agent on first start.</div>
  <script src="popup.js"></script>
</body>
</html>
