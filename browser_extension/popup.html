<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AppTracker</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 14px; background: #181b22; color: #e6e8ee; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  label { display: block; font-size: 11px; color: #9aa1ad; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a2f3a; background: #21252e; color: #e6e8ee; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { display: flex; gap: 6px; }
  button { padding: 6px 12px; border: 1px solid #2a2f3a; background: #2a2f3a; color: #e6e8ee; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button:hover { background: #353b48; }
  button.primary:hover { background: #1d4ed8; }
  .pause-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .hint { font-size: 11px; color: #9aa1ad; margin-top: 10px; line-height: 1.45; }
</style>
</head>
<body>
  <h3>AppTracker Bridge</h3>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Connecting</span>
  </div>

  <label for="api">AppTracker URL</label>
  <input type="text" id="api" placeholder="http://127.0.0.1:5007" />

  <label for="token">Token</label>
  <div class="row">
    <input type="text" id="token" placeholder="Auto-synced from AppTracker" />
    <button id="fetch" title="Pull token from AppTracker">Sync</button>
  </div>
  <button id="save" class="primary" style="margin-top: 8px;">Save and reconnect</button>

  <div class="pause-row">
    <input type="checkbox" id="paused" />
    <label for="paused" style="margin: 0; text-transform: none; letter-spacing: 0; color: #e6e8ee; font-size: 13px;">Pause tab updates</label>
  </div>

  <div class="hint">Connects to <code>/api/v1/browser</code> on the AppTracker app. Press <b>Sync</b> after starting AppTracker to fetch the token automatically.</div>
  <script src="popup.js"></script>
</body>
</html>
