[package]
name = "tracker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
image = { version = "0.24", default-features = false, features = ["png"], optional = true }
rand = "0.8"
rdev = { version = "0.5", optional = true }
regex = "1"
screenshots = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"

[features]
default = ["activity", "capture"]
activity = ["dep:rdev"]
capture = ["dep:image", "dep:screenshots"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
