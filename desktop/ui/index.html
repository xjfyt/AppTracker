<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Tracker Rust</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="pauseBtn" class="primary">暂停</button>
      <div>
        <h1>Active Tracker Rust</h1>
        <p>UI 只消费本机 API，采集核心运行在 Rust agent 中。</p>
      </div>
      <div class="spacer"></div>
      <label class="api">
        API
        <input id="apiBase" value="http://127.0.0.1:5007" />
      </label>
      <span id="status" class="badge">connecting</span>
    </header>

    <main class="layout">
      <section class="panel large">
        <h2>当前窗口</h2>
        <div id="windowGrid" class="grid"></div>
        <h3>文档 / 路径</h3>
        <div id="documents" class="list empty">暂无路径</div>
      </section>

      <section class="panel">
        <h2>浏览器 Tab</h2>
        <div id="browser" class="list empty">等待浏览器扩展连接</div>

        <h2>终端</h2>
        <div id="terminal" class="list empty">未识别到终端上下文</div>

        <h2>文件管理器</h2>
        <div id="files" class="list empty">未识别到文件管理器状态</div>
      </section>

      <section class="panel">
        <h2>活动</h2>
        <div id="activity" class="metric-row"></div>
        <h2>截图</h2>
        <img id="screenshot" alt="latest focused window screenshot" />
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
