[project]
name = "active-tracker"
version = "0.1.0"
description = "Realtime cross-platform active app & document tracker with PySide6 GUI."
authors = [
    { name = "wxj", email = "xjwu@mimouse.net" }
]
requires-python = "==3.12.*"
dependencies = [
    "ewmh>=0.1.6 ; sys_platform == 'linux'",
    "mss>=9.0",
    "pillow>=10.0",
    "psutil>=5.9",
    "pynput>=1.7",
    "pyobjc-framework-applicationservices>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.0 ; sys_platform == 'darwin'",
    "pyside6>=6.11.1",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "qasync>=0.27",
    "uiautomation>=2.0 ; sys_platform == 'win32'",
    "websockets>=12.0",
]

# 这个项目本身不是可安装的 wheel，uv 只负责管理依赖与虚拟环境。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
